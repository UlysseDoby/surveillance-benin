name: Surveillance voyage.benin.bj

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:   # permet de le lancer à la main pour tester

permissions:
  contents: write      # nécessaire pour sauvegarder le fichier d'état

concurrency:
  group: surveillance
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Vérifier le site
        run: python surveillance_voyage_benin.py
        env:
          SMTP_UTILISATEUR: ${{ secrets.SMTP_UTILISATEUR }}
          SMTP_MOT_DE_PASSE: ${{ secrets.SMTP_MOT_DE_PASSE }}
          DESTINATAIRE: ${{ secrets.DESTINATAIRE }}

      - name: Sauvegarder l'état
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add etat_voyage_benin.json
          git diff --cached --quiet || (git commit -m "maj état" && git push)
